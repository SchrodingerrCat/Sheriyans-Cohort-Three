<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <title>Document</title>
</head>
<body>
    <div class="top">

        <nav>
            <div class="part1">
                <img src="https://pngimg.com/uploads/squid_game/squid_game_PNG35.png" alt="">
            </div>
            <div class="part2">
                <p>About</p>
                <p>Watch now</p>
                <p>Actors</p>
                <p>Contact</p>
            </div>
            <div class="part3">
                <img src="./images/hamburger_menu.png" alt="hamburger_menu">
            </div>
        </nav>

        <section>
            <div class="left">
                <div class="squid-game">
                    <img src="https://pngimg.com/uploads/squid_game/squid_game_PNG35.png" alt="squid-game">

                     <div class="star star-left"></div>
                     <div class="star star-right"></div>
                </div>

                <p>
                    Action/ Thriller / Drama Series directed by Dong-hyuk Hwang<br>
                    Season 1: 9 Episodes
                </p>

                <div class="buttons">
                    <button ><i style="color: black;" class="ri-play-fill"></i>&nbsp;&nbsp;Play Now</button>
                    <button><i class="ri-play-mini-line"></i>&nbsp;&nbsp;Watch Trailer</button>
                </div>

                
            </div>
            <div class="right">
                <img src="./images/masked_man.png" alt="">
                <div class="icons">
                    <i class="ri-twitter-line"></i>
                    <i class="ri-instagram-line"></i>
                    <i class="ri-facebook-fill"></i>
                </div>
            </div>

            <div class="scroll">
                    SCROLL
            </div>

            <div class="game">
                GAME
            </div>

            <div class="squid">
                SQUID
            </div>

        </section>

    </div>


    <div class="bottom">

        <div class="outer">

            <div class="card">
                <img src="./images/card-one.jpg" alt="">
            </div>
            <div class="card">
                <img src="./images/card-2.jpg" alt="">
            </div>
            <div class="card">
                <img src="./images/card-three.jpg" alt="">
            </div>

        </div>

    </div>
</body>
</html>
